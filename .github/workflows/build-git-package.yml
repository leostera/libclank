name: Build Git package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Build distributable package
        run: |
          bun run build:workspaces
          bun run build:git-package
          bun run assemble:git-package

      - name: Publish generated Git package branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          staging="$(mktemp -d)"
          cp -R build/git-package/. "$staging/"
          git checkout --orphan git-package-output
          git rm -rf .
          cp -R "$staging/." .
          git add --all
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Build Git package from ${SOURCE_SHA}"
          git push --force origin HEAD:refs/heads/git-package
