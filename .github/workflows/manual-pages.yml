name: Publish manual

on:
  push:
    branches: [main]
    paths:
      - "manual/**"
      - ".github/workflows/manual-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build manual with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./manual
          destination: ./_site
          future: true
          build_revision: ${{ steps.pages.outputs.build_revision }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        name: Deploy GitHub Pages
        uses: actions/deploy-pages@v4
